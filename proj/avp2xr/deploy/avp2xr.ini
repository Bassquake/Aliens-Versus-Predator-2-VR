
; avp2xr settings. Delete a line to use its default.
[VR]
; Flat virtual screen for menus and loading screens (metres)
ScreenDistance=2.0
ScreenWidth=2.0
ScreenHeight=0.0
; HUD panel over the 3D view (metres; straight ahead = where you look). Its apparent size is
; HudWidth / HudDistance: 2.25 / 1.5 matches the flat virtual screen; larger = bigger HUD text
; Defaults: Distance:1.5, Width:1.7, Vert Position:0.0
HudDistance=1.5
HudWidth=2.0
HudHeight=-0.2
; Sharpness of the HUD and menu text: their images are made at the headset's pixel density times this,
; smoothly scaled from the game's pixels. 0 = the game's pixels as they are (jaggier)
PanelScale=1.0
; Show the stereo view on the monitor too: 1 = every frame (costs ~0.15 ms), 0 = off, N = every Nth frame
DesktopMirror=1
; If the game runs in a window (it can start windowed, e.g. when launched from the headset), stretch
; the window over the monitor so the monitor still shows it full size
MirrorFillScreen=yes
; Bring the game's window to the front when it starts, so the keyboard works without alt-tab
FocusGameWindow=yes
; Which eye the monitor shows (cropped to fill the screen, with the HUD): left, right, or both side by side
MirrorEye=left
; Crosshair where the gun aims (not on the knife): yes or no
ShowCrosshair=yes
; The arms/weapon's idle sway and fidgets: no = hold still in your hand while idle, yes = play them
WeaponIdleAnimations=no
; Smooth the crosshairs: their tiny images are scaled up with a pixel-art scaler (rounder circles, no blocks)
CrosshairSmoothing=yes
; Size of the message text (pickups, mission messages) relative to the game's: more pixels per letter
MessageTextSize=1.5
; Speed through the in-game 3D cutscenes (skips them as the game's skip key does); some can't be skipped
SpeedThroughCutscenes=yes
; Skip the logo videos when the game starts (straight to the main menu)
SkipIntroVideos=yes
; The game's display mode, width x height x bit depth, set by the AVP2VR launchers whatever the original
; AVP2.exe launcher saved. 640x480x32 keeps the HUD and menu text large in the headset. Blank = the game's own
GameResolution=640x480x32
; Zooms (the Predator's, the railgun's) magnify your view: 1 = as much as the game zooms, 0 = not at all,
; in between = part of it (the view moves faster than your head while zoomed; lower it if that's uncomfortable)
ZoomStrength=1
; How many zoom levels the Predator's Zoom button steps through before zooming back out (1-3)
ZoomSteps=2
; The railgun zoom's green overlay:
;   head = on your view, but moved so its centre is where the gun aims (RailScopeScale = its size, 1 = the game's)
;   gun  = on the gun like a scope: a panel RailScopeSize cm across, RailScopeDistance cm ahead of the muzzle
;   no   = covers the view as in the game
RailScope=head
RailScopeScale=1.5
RailScopeDistance=0
RailScopeSize=80
; Right stick left/right: smooth (turns while pushed) or snap (one turn per push)
TurnMode=snap
; Smooth turn speed at full push, degrees per second
SmoothTurnSpeed=120
; Snap turn angle, degrees
SnapTurnAngle=45
; Always run (Marine, Predator and Alien) instead of walking
AlwaysRun=yes
; Seconds to hold an input written "long ..." in the bindings below
LongPressTime=0.5
; Where each weapon sits in the right hand is set per weapon in [Gun], further down this file.
; The first-person model's left arm follows the left controller (no = it stays where the game has it)
LeftArm=yes
; Turn the left hand to mirror how the right hand holds each weapon (no = the animation's own angle,
; which differs from weapon to weapon)
LeftHandMatch=yes
; With the controllers close together the gun aims from the right hand to the left (two-handed); the
; left hand then goes this many cm below the gun, so it holds it from under instead of sitting in the barrel
TwoHandedHandDown=10
; How the left hand sits on the left controller (per weapon: [LeftHand], further down this file):
; in cm, LeftHandForward + moves it forward / - back towards you, LeftHandUp + up, LeftHandRight + right;
; in degrees, LeftHandPitch + tilts it up / - down, LeftHandYaw + turns it right, LeftHandRoll + clockwise
LeftHandForward=-6
LeftHandUp=0
LeftHandRight=0
LeftHandPitch=-10
LeftHandYaw=10
LeftHandRoll=0

