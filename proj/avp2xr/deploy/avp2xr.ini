; ------------------------------------------------------------------------------------------------
; Controller bindings, one section per controller type. The Quest 2 / Quest 3 / Rift use [Touch].
;
; Each line is an action and the input(s) that trigger it:
;   <left|right> <input>      e.g. right trigger, left x, right grip, left thumbstick
;   several inputs            separated by commas, e.g.  Jump=right a, left thumbstick
;   nothing                   leaves the action unbound, e.g.  Vision=
;   a full OpenXR path        e.g. /user/hand/right/input/a/click
;   <left|right> <thumbstick|trackpad> <up|down|left|right>   pushing that stick that way, e.g.
;                             NextWeapon=right thumbstick up
;   long <input>              held for LongPressTime, e.g.  Objectives=long left x. A quick press of
;                             that input then gives its other actions when it's let go.
; Inputs: trigger, grip, a, b, x, y, thumbstick (the click), trackpad, menu, thumbrest, select
; (not every controller has every input; left menu is the Touch menu button).
;
; Actions: Move and Turn take a stick (Move = walk relative to where you look, Turn = turn
; left/right (see TurnMode) and next/previous weapon up/down). The others are buttons: Fire, AltFire,
; Jump, Crouch, Use, Vision (vision mode), Reload, Taunt (multiplayer only; unbound by default),
; Cloak (the Predator cloak, like the C key), Flare (the Marine flare, like F); both unbound by
; default, and each does nothing for the other species, so they can share a button.
; DiscRetrieve (the Predator disc retrieve, like F; only acts for the Predator, so it can share a
; button with Reload), WallWalk (the Alien wall-walk while held, like left Shift), Hack (the H key:
; Marine hacking device, Predator's H item; the Alien has nothing on H), Pounce (the Alien pounce,
; like E; only Aliens can pounce, so it can share a button with Use).
; Objectives (the mission objectives: a press shows them, the next hides them; like Tab), Zoom (the Predator's zoom: the next
; level each press, then back to none), ShoulderLamp (the Marine's shoulder lamp on/off; only
; Marines have it and only the Predator zooms, so the two can share a button).
; TorchSift (the T key: Marine welding torch, Predator energy sift; the Alien has nothing on T).
; Medicomp (the Predator medicomp, like G; only acts for the Predator).
; NextWeapon and PrevWeapon (the next or previous weapon, one per press; by default the right stick
; up and down).
; Menus: MenuSelect (Enter) and MenuBack (back) only act in menus, where either stick moves
; between options (up/down) and changes sliders (left/right). Pause opens the menu while playing
; and is back in the menus (it's the Esc key).
;
; If the runtime refuses a section (an input that controller doesn't have), the defaults are used
; and avp2xr.log (in %LOCALAPPDATA%\avp2xr) says why.
; ------------------------------------------------------------------------------------------------

[Touch]
